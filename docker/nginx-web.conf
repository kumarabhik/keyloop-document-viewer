# Serves the published Blazor WebAssembly app (D-025). The browser calls the API on :8080 directly (CORS).

# Deep links carry the VIN in the query string (/?vin=...), and the default log format records the whole request
# line. Log the path only, never $request or $args, so no raw VIN reaches the logs (invariant 7, D-011).
log_format no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    access_log /var/log/nginx/access.log no_query;
    listen 80;
    root /usr/share/nginx/html;

    # Publish writes .br/.gz next to each file; serve the .gz when the browser accepts it.
    gzip_static on;

    location / {
        # Client-side routes such as /?vin=... all load index.html.
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /appsettings.json {
        add_header Cache-Control "no-cache";
    }
}
