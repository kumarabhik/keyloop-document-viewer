# docker compose up --build                 → API :8080, Sales mock :8081, Service mock :8082, UI :5173, Postgres, Redis
# docker compose --profile obs up --build   → + Prometheus :9090, Grafana :3000, Jaeger :16686
# docker compose --profile load run --rm k6 → load test against the running stack (infra/k6/search.js, D5.4)
# Every variable has a working default, so a clean clone runs without a .env file (see .env.example).
name: docviewer

x-dotnet-app: &dotnet-app
  restart: unless-stopped
  environment: &dotnet-env
    ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

services:
  api:
    <<: *dotnet-app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
      args:
        PROJECT: src/DocViewer.Api/DocViewer.Api.csproj
    ports: ["8080:8080"]
    environment:
      <<: *dotnet-env
      # Timeout/Command Timeout: Npgsql would otherwise wait 15 s / 30 s on a dead database (E-018).
      ConnectionStrings__DocViewer: Host=postgres;Database=${POSTGRES_DB:-docviewer};Username=${POSTGRES_USER:-docviewer};Password=${POSTGRES_PASSWORD:-docviewer-local};Timeout=3;Command Timeout=5
      ConnectionStrings__Redis: redis:6379
      Persistence__Provider: Postgres
      Persistence__VinHashSalt: ${VIN_HASH_SALT:-local-demo-salt-change-me}
      Sources__Sales__BaseUrl: http://sales-mock:8080
      Sources__Service__BaseUrl: http://service-mock:8080
      Cors__AllowedOrigins__0: http://localhost:5173
      # Traces go to Jaeger when the obs profile runs; without it the exporter fails silently.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      OTEL_SERVICE_NAME: docviewer-api
    # The chiselled image has no curl, so the API probes itself: exit 0 when /readyz answers 2xx (D-023).
    healthcheck:
      test: ["CMD", "dotnet", "DocViewer.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      sales-mock: { condition: service_started }
      service-mock: { condition: service_started }

  sales-mock:
    <<: *dotnet-app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: sales-mock
      args:
        PROJECT: mocks/SalesSystem.Mock/SalesSystem.Mock.csproj
    ports: ["8081:8080"]

  service-mock:
    <<: *dotnet-app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: service-mock
      args:
        PROJECT: mocks/ServiceSystem.Mock/ServiceSystem.Mock.csproj
    ports: ["8082:8080"]

  # Demo client (D-025): static Blazor WebAssembly files; the browser calls the API on :8080 and the mocks' fault switches.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    ports: ["5173:80"]
    depends_on: [api]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docviewer}
      POSTGRES_USER: ${POSTGRES_USER:-docviewer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docviewer-local}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.7.0
    profiles: [obs]
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [obs]
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    profiles: [obs]
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC

  # D5.4 load test; runs only on demand. Talks to the services by their compose names.
  k6:
    image: grafana/k6:1.8.1
    profiles: [load]
    volumes: ["./infra/k6:/scripts:ro"]
    environment:
      API_URL: http://api:8080
      SALES_URL: http://sales-mock:8080
      SERVICE_URL: http://service-mock:8080
    command: ["run", "/scripts/search.js"]
    depends_on: [api]

volumes:
  pgdata:
