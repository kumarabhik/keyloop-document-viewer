name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: Build, format, test, coverage, contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore

      # Warnings are errors (Directory.Build.props, D-017). The build also regenerates docs/openapi.json.
      - name: Build
        run: dotnet build --no-restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      # Runs every test project with coverage and fails if Domain or Application drop below 85 % (D2.7).
      - name: Test + coverage gate
        shell: pwsh
        run: ./scripts/coverage.ps1 -NoBuild

      - name: OpenAPI contract has not drifted
        run: |
          if ! git diff --exit-code -- docs/openapi.json; then
            echo "::error file=docs/openapi.json::docs/openapi.json is out of date. Run 'dotnet build' and commit the result."
            exit 1
          fi

      - name: Coverage summary
        if: always()
        run: |
          if [ -f TestResults/coverage/report/SummaryGithub.md ]; then
            cat TestResults/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: TestResults/coverage/report
          if-no-files-found: ignore

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API, mock and UI images
        run: docker compose build api sales-mock service-mock web

  # D-035: the Helm chart renders, passes Kubernetes schema validation, and refuses unsafe values. Helm is on the runner.
  helm:
    name: Helm chart (lint, schema, guard rails)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: helm lint deploy/helm/docviewer --strict
      - name: Render default and production-like values, validate against Kubernetes 1.33 schemas
        run: |
          helm template demo deploy/helm/docviewer > default.yaml
          helm template demo deploy/helm/docviewer \
            --set api.environment=Production --set api.vinHashSalt=ci-only-not-a-demo-salt \
            --set mocks.enabled=false --set sources.salesUrl=http://sales --set sources.serviceUrl=http://service \
            --set postgres.enabled=false --set externalDatabase.existingSecret=docviewer-db \
            --set redis.enabled=false --set externalRedis.connectionString=redis:6379 \
            --set api.auth.enabled=true --set api.auth.authority=https://idp.example --set api.auth.audience=docviewer-api \
            --set ingress.enabled=true > production.yaml
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.33.0 /work/default.yaml /work/production.yaml
      - name: Unsafe values are refused
        # Not "! helm ...": bash -e ignores the status of a negated command, so that line could never fail the step.
        run: |
          for unsafe in api.environment=Production mocks.enabled=false api.auth.enabled=true; do
            if helm template x deploy/helm/docviewer --set "$unsafe" > /dev/null 2>&1; then
              echo "::error::the chart rendered with unsafe value $unsafe"; exit 1
            fi
          done

  # D-026: generated requests against the real API, checked against the committed contract (docs/openapi.json).
  # negative_data_rejection is excluded on purpose: the API accepts more spellings than it advertises (D-021).
  contract-fuzz:
    name: Contract fuzzing (Schemathesis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start API, mocks, Postgres and Redis
        # The fuzzer sends thousands of requests from one address; lift the per-IP search limit (R5) for this job only.
        env:
          RATE_LIMIT_PER_MINUTE: "1000000"
        run: docker compose up --build --detach --wait api
      - name: Fuzz the API against docs/openapi.json
        run: |
          # The image runs as a non-root user; let it write the report into the runner-owned folder.
          mkdir -p schemathesis-report && chmod 777 schemathesis-report
          docker run --rm --network docviewer_default \
            -v "$PWD/docs:/docs:ro" -v "$PWD/schemathesis-report:/report" -v "$PWD/infra/schemathesis:/cfg:ro" \
            schemathesis/schemathesis:4.31.1 --config-file /cfg/schemathesis.toml run /docs/openapi.json \
            --url http://api:8080 --checks all --exclude-checks negative_data_rejection \
            --max-time 90 --workers 2 --report junit --report-dir /report
      - name: API logs on failure
        if: failure()
        run: docker compose logs api --tail 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schemathesis-report
          path: schemathesis-report
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
