{{- include "docviewer.validate" . -}}
{{- $postgres := include "docviewer.name" (dict "root" . "component" "postgres") -}}
{{- $redis := include "docviewer.name" (dict "root" . "component" "redis") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docviewer.secretName" . }}
  labels: {{- include "docviewer.labels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.api.existingSaltSecret }}
  VIN_HASH_SALT: {{ .Values.api.vinHashSalt | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  # Timeout / Command Timeout: Npgsql would otherwise wait 15 s / 30 s on a dead database (E-018).
  DOCVIEWER_DB: {{ printf "Host=%s;Database=%s;Username=%s;Password=%s;Timeout=3;Command Timeout=5" $postgres .Values.postgres.database .Values.postgres.username .Values.postgres.password | quote }}
  {{- else if and (not .Values.externalDatabase.existingSecret) .Values.externalDatabase.connectionString }}
  DOCVIEWER_DB: {{ .Values.externalDatabase.connectionString | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  # Client defaults wait ~5 s per call on a dead Redis (E-019).
  REDIS: {{ printf "%s:6379,connectTimeout=2000,syncTimeout=1000,asyncTimeout=1000,abortConnect=false" $redis | quote }}
  {{- else }}
  REDIS: {{ .Values.externalRedis.connectionString | quote }}
  {{- end }}
