{{- if .Values.redis.enabled }}
{{- $ctx := dict "root" . "component" "redis" -}}
# Shared response cache and breaker state (D-015, D-032). No persistence: losing it costs cache misses only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docviewer.name" $ctx }}
  labels: {{- include "docviewer.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "docviewer.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "docviewer.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # the redis user of the official image
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ include "docviewer.image" (dict "root" . "image" .Values.redis.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "docviewer.name" $ctx }}
  labels: {{- include "docviewer.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "docviewer.selector" $ctx | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
{{- end }}
